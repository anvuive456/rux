# Generate the Xcode project: `xcodegen` (brew install xcodegen); `rux run ios` does it for you.
# Requires running `rux build ios` first to produce rux.yml, {{lib_name}}.xcframework and
# rux.xcconfig (bundle id + app version, generated from Cargo.toml).
# No `bundleIdPrefix`: PRODUCT_BUNDLE_IDENTIFIER comes from rux.xcconfig, and a value
# generated by XcodeGen in the target settings would override it.
name: {{project_name}}
options:
  deploymentTarget:
    iOS: "15.0"

# The RuxRuntime Swift package, from the `rux` crate cargo resolved for the app: written to
# rux.yml (gitignored) by `rux build ios`.
include:
  - rux.yml

targets:
  {{project_name}}:
    type: application
    platform: iOS
    sources:
      - Sources
      # Native APIs (#[rux::host_api]): code generated by `rux build ios` + plugin sources.
      - path: rux-generated
        optional: true
    configFiles:
      Debug: rux.xcconfig
      Release: rux.xcconfig
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: "{{display_name}}"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    dependencies:
      - package: RuxRuntime
      - framework: "{{xcframework}}"
        embed: false
