# Pins the toolchain for everyone (and CI); rustup installs it, with these targets, on first use.
# Keep `channel` in sync with `rust-version` in Cargo.toml.
[toolchain]
channel = "1.100"
components = ["rustfmt", "clippy"]
targets = [
    "aarch64-linux-android",
    "x86_64-linux-android",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
]
