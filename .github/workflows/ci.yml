name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android, aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # Type-check the macro-generated JNI / C entry points for the mobile targets.
      - name: Check (Android target)
        run: cargo check -p rux-example-counter --target aarch64-linux-android --features rux/android

      - name: Check (iOS target)
        run: cargo check -p rux-example-counter --target aarch64-apple-ios --features rux/ios

      # `rux new`: the generated app's tests pass (warnings are errors) outside the checkout.
      - name: rux new + test
        run: |
          app="$RUNNER_TEMP/hello-rux"
          cargo run -p rux-cli -- new "$app" --platforms ios
          test ! -e "$app/ios"
          test ! -e "$app/android"
          cargo test --manifest-path "$app/Cargo.toml"
          test -n "$(find "$app/target" -path '*/out/ios/project.yml' -print -quit)"
          test -z "$(find "$app/target" -path '*/out/android' -print -quit)"

  android:
    name: Android
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle; the version itself comes from the project's wrapper.
      - uses: gradle/actions/setup-gradle@v4

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # ANDROID_NDK_LATEST_HOME is a runner environment variable, not part of the
      # `env` context, so it must be read in the shell rather than via ${{ env.* }}.
      - name: Build Rust library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "Using NDK at $ANDROID_NDK_HOME"
          cargo run -p rux-cli -- build android --path examples/counter --abi arm64-v8a --abi x86_64

      - name: Build APK
        working-directory: examples/counter/android
        run: ./gradlew assembleDebug --no-daemon

      # Release: R8 runs with rux-runtime's keep rules (consumer-rules.pro).
      # Release builds package the release Rust library (src/release/jniLibs).
      - name: Build APK (release, R8)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo run -p rux-cli -- build android --path examples/counter --abi arm64-v8a --abi x86_64 --release
          cd examples/counter/android
          ./gradlew assembleRelease --no-daemon
          grep -F 'dev.rux.runtime.RuxChannels: void invoke(' app/build/outputs/mapping/release/seeds.txt
          grep -F 'dev.rux.generated.RuxRegistrant: void register(' app/build/outputs/mapping/release/seeds.txt

      - uses: actions/upload-artifact@v4
        with:
          name: counter-android-debug
          path: examples/counter/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # `rux new`: the generated Android project builds as is, outside the checkout.
      - name: rux new + build APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo run -p rux-cli -- new "$RUNNER_TEMP/hello-rux" --platforms android
          cargo run -p rux-cli -- build android --path "$RUNNER_TEMP/hello-rux" --abi x86_64
          project=$(find "$RUNNER_TEMP/hello-rux/target/x86_64-linux-android/debug/build" -path '*/out/android' -type d -print -quit)
          cd "${project:?missing generated Android project}"
          ./gradlew assembleDebug --no-daemon

  ios:
    name: iOS
    runs-on: macos-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Rust xcframework
        run: cargo run -p rux-cli -- build ios --path examples/counter

      - name: Generate Xcode project
        working-directory: examples/counter/ios
        run: xcodegen generate

      # The xcframework only ships an arm64 simulator slice, so build arm64 only.
      - name: Build app (simulator)
        working-directory: examples/counter/ios
        run: |
          xcodebuild build \
            -project RuxCounter.xcodeproj \
            -scheme RuxCounter \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO

      # `rux new`: the generated iOS project builds as is, outside the checkout.
      - name: rux new + build app (simulator)
        run: |
          cargo run -p rux-cli -- new "$RUNNER_TEMP/hello-rux" --platforms ios
          cargo run -p rux-cli -- build ios --path "$RUNNER_TEMP/hello-rux"
          project=$(find "$RUNNER_TEMP/hello-rux/target/aarch64-apple-ios/debug/build" -path '*/out/ios' -type d -print -quit)
          cd "${project:?missing generated iOS project}"
          xcodegen generate
          xcodebuild build \
            -project HelloRux.xcodeproj \
            -scheme HelloRux \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO
