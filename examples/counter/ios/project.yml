# Generate the Xcode project: `xcodegen` (brew install xcodegen)
# Requires running `rux build ios` first to produce target/ios/counter.xcframework and
# rux.xcconfig (bundle id + app version, generated from Cargo.toml).
# No `bundleIdPrefix`: PRODUCT_BUNDLE_IDENTIFIER comes from rux.xcconfig, and a value
# generated by XcodeGen in the target settings would override it.
name: RuxCounter
options:
  deploymentTarget:
    iOS: "15.0"

packages:
  RuxRuntime:
    path: ../../../platforms/ios

targets:
  RuxCounter:
    type: application
    platform: iOS
    sources: [Sources]
    configFiles:
      Debug: rux.xcconfig
      Release: rux.xcconfig
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Rux Counter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    dependencies:
      - package: RuxRuntime
      - framework: ../../../target/ios/counter.xcframework
        embed: false
