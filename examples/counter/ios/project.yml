# Generate the Xcode project: `xcodegen` (brew install xcodegen)
# Requires running `rux build ios` first to produce rux.yml, target/ios/counter.xcframework and
# rux.xcconfig (bundle id + app version, generated from Cargo.toml).
# No `bundleIdPrefix`: PRODUCT_BUNDLE_IDENTIFIER comes from rux.xcconfig, and a value
# generated by XcodeGen in the target settings would override it.
name: RuxCounter
options:
  deploymentTarget:
    iOS: "15.0"

# The RuxRuntime Swift package, from the `rux` crate cargo resolved for the app: written to
# rux.yml (gitignored) by `rux build ios`.
include:
  - rux.yml

targets:
  RuxCounter:
    type: application
    platform: iOS
    sources:
      - Sources
      # Native APIs (#[rux::host_api]): code generated by `rux build ios` + plugin sources.
      - path: rux-generated
        optional: true
    configFiles:
      Debug: rux.xcconfig
      Release: rux.xcconfig
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Rux Counter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    # The Rust library in the xcframework must be built for the configuration being built
    # (`rux build ios` / `rux build ios --release`), so a Release build never links the debug one.
    preBuildScripts:
      - name: Check rux library
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(SRCROOT)/../../../target/ios/counter.xcframework/../counter.profile"
        script: |
          marker="$SRCROOT/../../../target/ios/counter.xcframework/../counter.profile"
          if [ "$CONFIGURATION" = Release ]; then want=release; flag=" --release"; else want=debug; flag=""; fi
          have=$(cat "$marker" 2>/dev/null)
          if [ "$have" != "$want" ]; then
            echo "error: the Rust library (../../../target/ios/counter.xcframework) is a ${have:-missing} build, $CONFIGURATION needs $want: run \`rux build ios$flag\`."
            exit 1
          fi
    dependencies:
      - package: RuxRuntime
      - framework: ../../../target/ios/counter.xcframework
        embed: false
